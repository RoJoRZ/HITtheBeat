name: Issue checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:desktop
      - name: Build and run only affected test groups
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-tests.mjs
      - name: Validate installer harness against existing 1.0.0 (no new installer build)
        if: github.head_ref == 'codex/issue-8-ci-completion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-installer.mjs --existing
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-diagnostics-${{ matrix.os }}
          path: test-results/
